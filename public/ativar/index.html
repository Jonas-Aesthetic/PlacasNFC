<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Ative sua placa · VyntraTags</title><style>
*{box-sizing:border-box}body{margin:0;overflow-x:hidden;background:linear-gradient(#eef4ff,#fff 280px);color:#0f172a;font:16px system-ui,sans-serif;padding:16px}.w{width:min(520px,100%);margin:0 auto 14px;display:grid;gap:14px}.hd{display:flex;justify-content:space-between;align-items:center}.logo{color:#2563eb;font-weight:800;font-size:22px}
.card{background:#fff;border:1px solid #e4e9f2;border-radius:20px;padding:20px;box-shadow:0 8px 24px #0f172a12;display:grid;gap:14px}#st{display:flex;gap:8px}#st div{flex:1;text-align:center;font-size:12px;color:#94a3b8}#st b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#e4e9f2;margin:0 auto 4px;font-size:13px}#st .on{color:#2563eb}#st .on b{background:#2563eb;color:#fff}
h2{margin:0;font-size:20px}.m{color:#64748b;margin:0}label{display:grid;gap:6px;color:#64748b;font-size:14px}input,textarea{font:inherit;font-size:16px;border:1px solid #d9e1ef;border-radius:12px;padding:13px;width:100%;color:#0f172a}input:focus{outline:2px solid #bfd3ff;border-color:#2563eb}.pin{font-size:26px;letter-spacing:6px;text-align:center;font-weight:700;text-transform:uppercase}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px;background:#2563eb;color:#fff;cursor:pointer;text-align:center;text-decoration:none;display:block}button.s{background:#fff;color:#2563eb;border:1px solid #2563eb;padding:10px 14px}
.tp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.tp button{background:#fff;color:#0f172a;border:1px solid #d9e1ef;padding:12px 8px;font-size:14px}.tp button.on{border-color:#2563eb;background:#eaf1ff;color:#2563eb}.tp span{display:block;font-size:22px}
.r2{display:grid;grid-template-columns:1fr 1fr 42px;gap:6px}.r2 .x{padding:0;background:#fee2e2;color:#dc2626}.pb{height:8px;background:#e4e9f2;border-radius:99px;overflow:hidden}.pb i{display:block;height:100%;background:#2563eb;transition:width .4s}
.ph{border:6px solid #0f172a;border-radius:28px;padding:18px 14px;background:#f8fafc;text-align:center;display:grid;gap:8px;max-width:260px;margin:auto;width:100%;word-break:break-all}.ph .b{background:#2563eb;color:#fff;border-radius:10px;padding:10px;font-size:14px;font-weight:600}
.e{color:#dc2626;text-align:center;margin:0}.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #eef1f7}.it span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.big{width:72px;height:72px;border-radius:50%;background:#16a34a;color:#fff;display:grid;place-items:center;font-size:40px;margin:auto;animation:pop .5s}@keyframes pop{from{transform:scale(0)}}.hide{display:none!important}
#tu{position:fixed;inset:0;background:#0f172a99;display:grid;place-items:center;padding:16px;z-index:9}#tu .card{width:min(440px,100%);text-align:center}.sl{font-size:54px}.tb{height:6px;background:#e4e9f2;border-radius:99px;overflow:hidden}.tb i{display:block;height:100%;background:#2563eb;width:0}.tb i.go{animation:fill 15s linear forwards}@keyframes fill{to{width:100%}}.dots{display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:#d9e1ef}.dots i.on{background:#2563eb}
</style></head><body><div class="w"><div class="hd"><div class="logo">VyntraTags</div><button class="s" onclick="tu(0)">▶ Tutorial 1 min</button></div><div id="st"></div><div class="card" id="v"></div></div>
<div id="tu" class="hide" onclick="if(event.target==this)tu(-1)"><div class="card" id="tc"></div></div><script>
const Q=new URLSearchParams(location.search);let C=(Q.get('c')||'').toLowerCase(),PIN='',M=null,I=null,msg='',err='',ok=false,T='google',S={e:'',v:''},BT=[{t:'',u:''}];const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TP=[['google','⭐','Avaliações Google','Link de avaliação do Google','https://g.page/r/...'],['instagram','📸','Instagram','Seu @usuário','@seuperfil'],['whatsapp','💬','WhatsApp','Seu número com DDD','(11) 99999-9999'],['pix','💸','Pix','Link de pagamento Pix','https://...'],['site','🔗','Site ou outro link','Endereço do link','https://...'],['pagina','🧩','Vários botões','','']];
async function api(a,x={}){const r=await fetch('/api/ativar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:a,pin:PIN,code:C,...x})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erro');return j}
async function start(){if(C){try{I=await api('info')}catch(e){err=e.message}}draw()}
function dest(){let v=S.v.trim();if(T=='instagram')return v?'https://instagram.com/'+v.replace(/^@/,''):'';if(T=='whatsapp'){let n=v.replace(/\D/g,'');if(n&&n.length<=11)n='55'+n;return n?'https://wa.me/'+n:''}return v}
function infer(p){if(p.modo=='pagina')return{t:'pagina',v:'',b:(p.links||'').split('\n').map(l=>l.split('|')).filter(a=>a[0].trim()).map(a=>({t:a[0].trim(),u:(a[1]||'').trim()}))};const d=p.destino||'';let t='site',v=d;if(/instagram\.com\//i.test(d)){t='instagram';v='@'+d.split('instagram.com/')[1].replace(/\/.*$/,'')}else if(/wa\.me\//i.test(d)){t='whatsapp';v=d.split('wa.me/')[1]}else if(/g\.page|google\./i.test(d))t='google';return{t,v,b:[]}}
function openP(c){C=c;ok=false;msg='';err='';const p=M.items.find(x=>x.code==c);if(p){const f=infer(p);T=f.t;S={e:p.estab,v:f.v};BT=f.b}else{T='google';S={e:'',v:''};BT=[]}if(!BT.length)BT=[{t:'',u:''}];draw()}
function rows(){return BT.map((b,i)=>`<div class="r2"><input placeholder="Texto" value="${esc(b.t)}" oninput="BT[${i}].t=this.value;pv()"><input placeholder="Link" value="${esc(b.u)}" oninput="BT[${i}].u=this.value;pv()">${BT.length>1?`<button class="x" onclick="BT.splice(${i},1);draw()">✕</button>`:'<span></span>'}</div>`).join('')+(BT.length<6?'<button class="s" onclick="BT.push({t:\'\',u:\'\'});draw()">+ Adicionar botão</button>':'')}
function pv(){const e=$('pv');if(!e)return;const n=S.e||'Seu negócio';if(T=='pagina'){const b=BT.filter(x=>x.t);e.innerHTML=`<b>${esc(n)}</b>`+(b.map(x=>`<div class="b">${esc(x.t)}</div>`).join('')||'<span class="m">Adicione botões acima</span>')}else e.innerHTML=`<b>${esc(n)}</b><div class="b">Abre: ${esc(dest()||'…')}</div>`}
function draw(){const mine=M&&M.items.find(p=>p.code==C),livre=I&&I.livre,step=!M?1:ok?3:2;let h='';
$('st').innerHTML=['PIN','Configurar','Pronto'].map((l,i)=>`<div class="${i+1<=step?'on':''}"><b>${i+1<step?'✓':i+1}</b>${l}</div>`).join('');
const ls=M&&M.items.length?`<h3 style="margin:6px 0 0;font-size:16px">Suas placas</h3>${M.items.map(p=>`<div class="it"><span><b>${esc(p.code)}</b> · ${esc(p.estab)||'sem nome'}</span><button class="s" onclick="openP('${p.code}')">Editar</button></div>`).join('')}`:'';
if(!M)h=`<h2>Ative sua placa</h2><p class="m">${C?'Placa <b>'+esc(C)+'</b> detectada. Digite o PIN do seu cartão.':'Digite o PIN do seu cartão para ver ou editar suas placas.'}</p>${err?`<p class="e">${esc(err)}</p>`:''}${I&&I.bloq?'<p class="e">Esta placa está bloqueada.</p>':`<input id="pin" class="pin" autocomplete="off" autocapitalize="characters" maxlength="12" placeholder="PIN" onkeydown="if(event.keyCode==13)go()"><button onclick="go()">Continuar</button>`}<button class="s" onclick="tu(0)">▶ Ver tutorial de 1 minuto</button>`;
else if(ok)h=`<div class="big">✓</div><h2 style="text-align:center">${esc(msg)}</h2><p class="m" style="text-align:center">Aproxime o celular da placa para testar. Tudo fica salvo na nuvem: edite de qualquer aparelho com o seu PIN.</p><a class="btn" href="/r/${esc(C)}" target="_blank">Testar agora</a><button class="s" onclick="ok=false;draw()">Editar esta placa</button>${ls}`;
else{h=`<p class="m">Olá, <b>${esc(M.cliente)}</b> · ${M.usadas} de ${M.qtd} placas ativadas</p><div class="pb"><i style="width:${M.qtd?M.usadas/M.qtd*100:0}%"></i></div>${err?`<p class="e">${esc(err)}</p>`:''}`;
if(C&&I&&I.bloq)h+='<p class="e">Esta placa está bloqueada.</p>';
else if(C&&(livre||mine)){const cur=TP.find(x=>x[0]==T);h+=`<h2>${livre?'Configure':'Edite'} a placa ${esc(C)}</h2><p class="m">O que acontece quando alguém aproximar o celular?</p><div class="tp">${TP.map(([k,i,n])=>`<button class="${T==k?'on':''}" onclick="T='${k}';draw()"><span>${i}</span>${n}</button>`).join('')}</div>${T=='pagina'?rows():`<label>${cur[3]}<input value="${esc(S.v)}" placeholder="${cur[4]}" oninput="S.v=this.value;pv()" ${T=='whatsapp'?'inputmode="tel"':''}></label>`}<label>Nome do seu negócio<input value="${esc(S.e)}" oninput="S.e=this.value;pv()" placeholder="Ex.: Barbearia do João"></label><span class="m" style="text-align:center;font-size:13px">Prévia do que o visitante verá</span><div id="pv" class="ph"></div><button onclick="sv()">${livre?'Ativar placa':'Salvar alterações'}</button>`}
else if(C)h+='<p class="m">Esta placa já está ativa em outro cadastro.</p>';else h+='<p class="m">Para ativar uma nova placa, aproxime o celular dela.</p>';h+=ls}
h+='<p class="m" style="text-align:center;font-size:13px">☁️ Seus dados ficam salvos na nuvem. Acesse de qualquer aparelho com o seu PIN.</p>';$('v').innerHTML=h;pv()}
async function go(){PIN=$('pin').value.trim();try{err='';M=await api('minhas');if(C&&I&&(I.livre||M.items.find(p=>p.code==C)))return openP(C)}catch(e){err=e.message;M=null}draw()}
async function sv(){try{err='';const pg=T=='pagina',d=dest(),L=BT.filter(b=>b.t&&b.u).map(b=>b.t+' | '+b.u).join('\n');if(pg?!L:!d)throw new Error('Informe o link para continuar');const novo=I&&I.livre;await api(novo?'ativar':'editar',{fields:{estab:S.e,titulo:S.e,modo:pg?'pagina':'direto',destino:pg?'':d,links:pg?L:''}});M=await api('minhas');I=await api('info');ok=true;msg=novo?'Placa ativada!':'Alterações salvas!'}catch(e){err=e.message}draw()}
const SL=[['📦','1. Pegue o seu PIN','Ele está no cartão de ativação dentro da caixa: 8 letras e números.'],['📲','2. Aproxime o celular da placa','Encoste o celular na placa ou escaneie o QR Code. Esta página abre sozinha.'],['🔑','3. Digite o PIN e escolha o uso','Google, Instagram, WhatsApp, Pix ou vários botões. Preencha e toque em Ativar.'],['✅','4. Pronto! Teste na hora','Aproxime de novo: vai direto para o seu link. Para mudar, volte aqui com o mesmo PIN, de qualquer celular.']];let TT=null;
function tu(n){clearTimeout(TT);if(n<0||n>=SL.length){$('tu').classList.add('hide');return}const s=SL[n];$('tu').classList.remove('hide');$('tc').innerHTML=`<div class="sl">${s[0]}</div><h2>${s[1]}</h2><p class="m">${s[2]}</p><div class="tb"><i id="tbi"></i></div><div class="dots">${SL.map((_,i)=>`<i class="${i==n?'on':''}"></i>`).join('')}</div><div style="display:flex;gap:8px"><button class="s" style="flex:1" onclick="tu(${Math.max(0,n-1)})">Anterior</button><button style="flex:1" onclick="tu(${n+1})">${n==SL.length-1?'Fechar':'Próximo'}</button></div>`;requestAnimationFrame(()=>$('tbi').classList.add('go'));TT=setTimeout(()=>tu(n+1),15000)}
start()</script></body></html>

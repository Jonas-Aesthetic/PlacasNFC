<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>VyntraTags · Painel</title><style>
:root{--bg:#fff;--p:#fff;--p2:#f4f7fc;--b:#e4e9f2;--t:#0f172a;--m:#64748b;--a:#2563eb;--g:#16a34a;--y:#d97706;--r:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif}button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}header{display:flex;align-items:center;gap:16px;padding:12px 28px;background:#fff;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5}.logo{display:flex;align-items:center;gap:8px;color:var(--a);font-weight:800;font-size:20px;letter-spacing:-.02em}.logo i{width:26px;height:26px;border-radius:8px;background:var(--a);position:relative}.logo i:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;top:9px;left:9px}
nav{display:flex;gap:4px;flex:1;margin-left:12px}nav button,.btn{background:none;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;color:var(--m)}nav button.on{background:#eaf1ff;color:var(--a);font-weight:600}.btn{background:#fff;color:var(--t);border:1px solid var(--b)}.btn:hover{border-color:var(--a);color:var(--a)}.btn.pr{background:var(--a);border-color:var(--a);color:#fff}.btn.pr:hover{color:#fff;opacity:.9}.btn.dg{color:var(--r)}main{padding:28px;max-width:1280px;margin:auto}
.grid{display:grid;gap:16px}.k{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.c2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.card{background:#fff;border:1px solid var(--b);border-radius:16px;padding:20px;box-shadow:0 1px 3px #0f172a0d}.card h3{margin:0 0 14px;font-size:12px;color:var(--m);font-weight:700;text-transform:uppercase;letter-spacing:.06em}.kpi{border-top:3px solid var(--a)}.kpi b{font-size:32px;display:block;color:var(--a)}.kpi span{color:var(--m)}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--p2)}.bar i{display:block}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--b)}.row:last-child{border:0}.m{color:var(--m)}.dn{display:flex;align-items:center;gap:24px}.dn svg{width:150px;flex:none}.lg div{display:flex;gap:8px;align-items:center;margin:6px 0}.lg i{width:10px;height:10px;border-radius:50%}
.ch{display:flex;align-items:flex-end;gap:6px;height:150px}.cb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px;color:var(--m);gap:4px}.cb i{width:100%;background:var(--a);border-radius:6px 6px 0 0;min-height:2px;opacity:.9}.al{cursor:pointer}.al:hover{color:var(--a)}.pill{background:#eaf1ff;color:var(--a);border-radius:99px;padding:2px 10px;font-weight:700}.pill.w{background:#fef3c7;color:#b45309}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--b);white-space:nowrap}th{color:var(--m);font-size:12px;cursor:pointer;background:#f8fafd}tr:hover td{background:#f5f8ff}td.w{max-width:260px;overflow:hidden;text-overflow:ellipsis}.tw{overflow:auto;border:1px solid var(--b);border-radius:16px;background:#fff;box-shadow:0 1px 3px #0f172a0d}
.bd{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}.livre{background:#f1f5f9;color:#475569}.ativa{background:#fef3c7;color:#b45309}.usando{background:#dcfce7;color:#15803d}
.tb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,select,textarea{background:#fff;border:1px solid var(--b);border-radius:8px;padding:9px 12px}input:focus,select:focus,textarea:focus{outline:2px solid #bfd3ff;border-color:var(--a)}.tb input{flex:1;min-width:200px}
.ov{position:fixed;inset:0;background:#0f172a66;display:grid;place-items:center;padding:16px;z-index:9}.md{background:#fff;border:1px solid var(--b);border-radius:18px;padding:24px;width:min(520px,100%);display:grid;gap:12px;box-shadow:0 20px 50px #0f172a33}.md label{display:grid;gap:4px;color:var(--m);font-size:12px}.ac{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#lg{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(#f4f8ff,#fff)}#lg .md{width:380px}#ts{position:fixed;bottom:20px;right:20px;background:var(--t);color:#fff;padding:12px 18px;border-radius:10px;z-index:20}
</style></head><body>
<div id="lg"><form class="md" onsubmit="return login(event)"><div class="logo" style="font-size:26px"><i></i>VyntraTags</div><span class="m">Painel de gestão · acesso restrito</span><input id="pw" type="password" placeholder="Senha de acesso" autofocus><button class="btn pr">Entrar</button><span id="le" style="color:#fca5a5"></span></form></div>
<div id="app" class="hide"><header><div class="logo"><i></i>VyntraTags</div><nav><button id="n1" class="on" onclick="tab(1)">Painel</button><button id="n2" onclick="tab(2)">Placas</button><button id="n3" onclick="tab(3)">Estabelecimentos</button><button id="n4" onclick="tab(4)">Pedidos e PINs</button></nav><button class="btn" onclick="load()">Atualizar</button><button class="btn" onclick="out()">Sair</button></header><main id="mn"></main></div>
<div id="ts" class="hide"></div><div id="ov" class="ov hide" onclick="if(event.target==this)cl()"></div>
<script>
let D=[],DIAS={},V=1,F={q:'',s:'',m:'',x:'',o:'n',d:1},SEL=new Set();const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const st=p=>!(p.destino||(p.modo=='pagina'&&p.links))?'livre':p.scans>0?'usando':'ativa',LB={livre:'Livre',ativa:'Ativa',usando:'Em uso'};
const ago=t=>{if(!t)return'—';const s=(Date.now()-t)/1e3;return s<60?'agora':s<3600?Math.floor(s/60)+' min':s<86400?Math.floor(s/3600)+' h':Math.floor(s/86400)+' d'};
const toast=m=>{const e=$('ts');e.textContent=m;e.classList.remove('hide');setTimeout(()=>e.classList.add('hide'),2600)};
async function api(a,x={}){const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:a,...x})});const j=await r.json().catch(()=>({}));if(r.status==401&&a!=='login'){show(0);throw 0}if(!r.ok)throw new Error(j.error||'erro');return j}
function show(on){$('lg').classList.toggle('hide',on);$('app').classList.toggle('hide',!on)}
async function login(e){e.preventDefault();try{await api('login',{password:$('pw').value});show(1);load()}catch(x){$('le').textContent=x.message||'Falha'}return false}
async function out(){await api('logout').catch(()=>{});show(0)}
async function load(){try{const j=await api('list');if(j.redis===false){$('mn').innerHTML=box('Falta conectar o banco de dados','Conecte o Upstash Redis ao projeto na Vercel (Storage → Create → Upstash Redis → Connect Project), faça um Redeploy e recarregue esta página. Passo a passo no LEIA-ME.');return}D=j.items;DIAS=j.dias||{};if(!D.length){$('mn').innerHTML=box('Nenhuma placa cadastrada','<button class="btn pr" onclick="imp()">Importar as 200 placas</button>');return}render()}catch(e){if(e)toast(e.message)}}
const box=(t,m)=>`<div class="card"><h2 style="margin-top:0">${t}</h2><p class="m">${m}</p></div>`;
async function imp(){await api('import');toast('Placas importadas');load()}
function tab(n){V=n;[1,2,3,4].forEach(i=>$('n'+i).classList.toggle('on',i==n));render()}
function render(){V==1?dash():V==2?list():V==3?estab():ped()}
function dash(){const c={livre:0,ativa:0,usando:0},M={},W=Date.now()-6048e5;let sc=0,nf=0,stale=0,noe=0;
D.forEach(p=>{const s=st(p);c[s]++;sc+=p.scans;nf+=p.nfc;(M[p.modelo]??={livre:0,ativa:0,usando:0})[s]++;if(s=='ativa'&&(p.upd||0)<W)stale++;if(s!='livre'&&!p.estab)noe++});
const T=D.length,top=[...D].filter(p=>p.scans).sort((a,b)=>b.scans-a.scans).slice(0,6),rec=[...D].filter(p=>p.last).sort((a,b)=>b.last-a.last).slice(0,6);
let off=25;const dn=[['usando','var(--g)'],['ativa','var(--y)'],['livre','#cbd5e1']].map(([k,col])=>{const v=T?c[k]/T*100:0,s=`<circle cx="18" cy="18" r="15.9155" fill="none" stroke="${col}" stroke-width="4" stroke-dasharray="${v} ${100-v}" stroke-dashoffset="${off}"/>`;off-=v;return s}).join('');
const ds=[...Array(14)].map((_,i)=>{const k=new Date(Date.now()-(13-i)*864e5).toISOString().slice(0,10);return[k.slice(8)+'/'+k.slice(5,7),+DIAS[k]||0]}),mx=Math.max(1,...ds.map(x=>x[1]));
const al=[[stale,'Ativas sem leitura há mais de 7 dias',"F.x='stale';F.s='';F.m='';F.q='';tab(2)"],[noe,'Em uso/ativas sem estabelecimento',"F.x='noestab';F.s='';F.m='';F.q='';tab(2)"],...Object.entries(M).filter(([m,v])=>v.livre<5).map(([m,v])=>[v.livre,'Estoque baixo: '+m+' ('+v.livre+' livres)',''])].filter(a=>a[0]||a[1].startsWith('Estoque'));
const k=(n,l)=>`<div class="card kpi"><b>${n}</b><span>${l}</span></div>`;
$('mn').innerHTML=`<div class="grid k">${k(T,'Total de placas')}${k(c.livre,'Livres')}${k(c.ativa,'Ativas (sem leitura)')}${k(c.usando,'Em uso')}${k(sc,'Leituras totais')}${k(sc?Math.round(nf/sc*100)+'%':'—','Via NFC')}</div><br>
<div class="grid c2"><div class="card"><h3>Situação do estoque</h3><div class="dn"><svg viewBox="0 0 36 36">${dn}<text x="18" y="20" text-anchor="middle" font-size="7" font-weight="700" fill="#0f172a">${T}</text></svg><div class="lg"><div><i style="background:var(--g)"></i>Em uso · <b>${c.usando}</b></div><div><i style="background:var(--y)"></i>Ativas · <b>${c.ativa}</b></div><div><i style="background:#cbd5e1"></i>Livres · <b>${c.livre}</b></div></div></div></div>
<div class="card"><h3>Leituras nos últimos 14 dias</h3><div class="ch">${ds.map(([l,n])=>`<div class="cb" title="${l}: ${n}"><i style="height:${n/mx*85}%"></i><span>${l.slice(0,2)}</span></div>`).join('')}</div></div></div><br>
<div class="grid c2"><div class="card"><h3>Alertas</h3>${al.map(([n,t,f])=>`<div class="row ${f?'al':''}" ${f?`onclick="${f}"`:''}><span>${esc(t)}</span><span class="pill w">${n}</span></div>`).join('')||'<span class="m">Tudo certo ✓</span>'}</div>
<div class="card"><h3>Por modelo</h3>${Object.entries(M).map(([m,v])=>{const t=v.livre+v.ativa+v.usando;return`<div style="margin-bottom:12px"><div class="row" style="border:0;padding:0 0 6px"><span>${esc(m)}</span><span class="m">${v.livre} livres · ${v.ativa} ativas · ${v.usando} em uso</span></div><div class="bar"><i style="width:${v.usando/t*100}%;background:var(--g)"></i><i style="width:${v.ativa/t*100}%;background:var(--y)"></i><i style="width:${v.livre/t*100}%;background:#cbd5e1"></i></div></div>`}).join('')}</div>
<div class="card"><h3>Mais acessadas</h3>${top.map(p=>`<div class="row"><span>${esc(p.estab||p.code)}</span><span class="pill">${p.scans}</span></div>`).join('')||'<span class="m">Sem leituras ainda</span>'}</div>
<div class="card"><h3>Atividade recente</h3>${rec.map(p=>`<div class="row"><span>${esc(p.estab||p.code)}</span><span class="m">${ago(p.last)}</span></div>`).join('')||'<span class="m">Sem leituras ainda</span>'}</div></div>`}
function estab(){const E={};D.forEach(p=>{if(!p.estab)return;const e=E[p.estab]??={n:0,sc:0,last:0};e.n++;e.sc+=p.scans;e.last=Math.max(e.last,p.last)});const r=Object.entries(E).sort((a,b)=>b[1].sc-a[1].sc);window.ES=r.map(x=>x[0]);
$('mn').innerHTML=`<div class="tw"><table><thead><tr><th>Estabelecimento</th><th>Placas</th><th>Leituras</th><th>Último acesso</th><th></th></tr></thead><tbody>${r.map(([k,v],i)=>`<tr><td><b>${esc(k)}</b></td><td>${v.n}</td><td>${v.sc}</td><td>${ago(v.last)}</td><td><button class="btn" onclick="F.q=ES[${i}];F.s='';F.m='';F.x='';tab(2)">Ver placas</button></td></tr>`).join('')||'<tr><td colspan=5 class="m">Nenhum estabelecimento ainda</td></tr>'}</tbody></table></div>`}
function list(){const ms=[...new Set(D.map(p=>p.modelo))];$('mn').innerHTML=`<div class="tb"><input id="q" placeholder="Buscar código, estabelecimento ou destino" value="${esc(F.q)}" oninput="F.q=this.value;rows()"><select onchange="F.s=this.value;rows()"><option value="">Todos os status</option>${Object.entries(LB).map(([k,v])=>`<option value="${k}" ${F.s==k?'selected':''}>${v}</option>`).join('')}</select><select onchange="F.m=this.value;rows()"><option value="">Todos os modelos</option>${ms.map(m=>`<option ${F.m==m?'selected':''}>${esc(m)}</option>`).join('')}</select>${F.x?`<button class="btn" onclick="F.x='';list()">Filtro: ${F.x=='stale'?'ativas sem leitura 7d':'sem estabelecimento'} ✕</button>`:''}<button class="btn" onclick="csv()">Exportar CSV</button><button class="btn pr" onclick="lote()">Importar lote</button></div><div id="bk" class="tb hide"></div><div class="tw"><table><thead><tr><th><input type="checkbox" onchange="all(this.checked)"></th>${[['n','Nº'],['code','Código'],['modelo','Modelo'],['s','Status'],['estab','Estabelecimento'],['destino','Destino'],['scans','Leituras'],['last','Último acesso']].map(([k,l])=>`<th onclick="srt('${k}')">${l}</th>`).join('')}<th></th></tr></thead><tbody id="tbd"></tbody></table></div>`;rows()}
function srt(k){F.d=F.o==k?-F.d:1;F.o=k;rows()}
function view(){const q=F.q.toLowerCase();return D.filter(p=>(!F.s||st(p)==F.s)&&(F.x!='stale'||(st(p)=='ativa'&&(p.upd||0)<Date.now()-6048e5))&&(F.x!='noestab'||(st(p)!='livre'&&!p.estab))&&(!F.m||p.modelo==F.m)&&(!q||[p.code,p.estab,p.destino].join(' ').toLowerCase().includes(q))).sort((a,b)=>{const x=F.o=='s'?st(a):a[F.o],y=F.o=='s'?st(b):b[F.o];return(x>y?1:x<y?-1:0)*F.d})}
function rows(){const v=view();$('tbd').innerHTML=v.map(p=>{const s=st(p);return`<tr><td><input type="checkbox" ${SEL.has(p.code)?'checked':''} onchange="sel('${p.code}',this.checked)"></td><td>${p.n}</td><td><b>${p.code}</b></td><td>${esc(p.modelo)}</td><td><span class="bd ${s}">${LB[s]}</span>${p.bloq?' <span class="pill w">bloqueada</span>':''}${p.rev?' <span class="pill w">revisar</span>':''}</td><td class="w">${esc(p.estab)||'—'}</td><td class="w">${esc(p.destino)||'—'}</td><td>${p.scans}</td><td>${ago(p.last)}</td><td><button class="btn" onclick="ed('${p.code}')">${s=='livre'?'Ativar':'Editar'}</button></td></tr>`}).join('')||'<tr><td colspan=10 class="m">Nada encontrado</td></tr>';bk()}
function sel(c,on){on?SEL.add(c):SEL.delete(c);bk()}function all(on){view().forEach(p=>on?SEL.add(p.code):SEL.delete(p.code));rows()}
function bk(){const e=$('bk');if(!e)return;e.classList.toggle('hide',!SEL.size);e.innerHTML=`<span class="m" style="align-self:center">${SEL.size} selecionadas</span><button class="btn" onclick="bulkE()">Definir estabelecimento</button><button class="btn dg" onclick="bulkL()">Liberar</button>`}
async function sv(codes,f,msg){try{await api('save',{codes,fields:f});toast(msg);SEL.clear();cl();await load()}catch(e){toast(e.message)}}
function bulkE(){const n=prompt('Estabelecimento para as placas selecionadas:');if(n!==null)sv([...SEL],{estab:n},'Atualizado')}
function bulkL(){if(confirm('Liberar '+SEL.size+' placas? O destino e o estabelecimento serão apagados.'))sv([...SEL],{destino:'',estab:'',obs:'',titulo:'',links:'',modo:'direto',owner:'',bloq:''},'Placas liberadas')}
function ed(c){const p=D.find(x=>x.code==c),o=location.origin+'/r/'+c,f=(i,l,v,x='')=>`<label>${l}<input id="${i}" value="${esc(v)}" ${x}></label>`;
$('ov').innerHTML=`<div class="md" style="max-height:92vh;overflow:auto"><h3 style="margin:0">Placa ${p.n} · ${c}</h3><span class="m">${p.scans} leituras (${p.nfc} NFC) · o código ${c} está impresso e não muda</span>${f('e1','Estabelecimento',p.estab)}<label>Modo<select id="e6"><option value="direto" ${p.modo!='pagina'?'selected':''}>Redirecionar direto para um link</option><option value="pagina" ${p.modo=='pagina'?'selected':''}>Mostrar página com botões</option></select></label>${f('e2','Destino (modo direto)',p.destino,'placeholder="https://"')}${f('e4','Título da página',p.titulo)}${f('e5','Cor da página (ex.: #3b82f6)',p.cor)}<label>Botões da página (um por linha: Texto | link)<textarea id="e7" rows="4">${esc(p.links)}</textarea></label><label>Situação<select id="e10"><option value="">Normal</option><option value="1" ${p.bloq?'selected':''}>Bloqueada</option></select></label>${f('e8','Modelo',p.modelo)}${f('e9','Nº',p.n,'type="number"')}<label>Observações<textarea id="e3" rows="2">${esc(p.obs)}</textarea></label><div class="m">QR: ${o}<br>NFC: ${o}?o=n</div><div class="ac"><button class="btn" onclick="navigator.clipboard.writeText('${o}?o=n');toast('Link NFC copiado')">Copiar link NFC</button><button class="btn dg" onclick="del('${c}')">Excluir</button><button class="btn dg" onclick="sv(['${c}'],{destino:'',estab:'',obs:'',titulo:'',cor:'',links:'',modo:'direto',owner:'',bloq:''},'Placa liberada')">Liberar</button><button class="btn" onclick="cl()">Cancelar</button><button class="btn pr" onclick="sv(['${c}'],{estab:$('e1').value,destino:$('e2').value,obs:$('e3').value,titulo:$('e4').value,cor:$('e5').value,modo:$('e6').value,links:$('e7').value,modelo:$('e8').value,n:$('e9').value,bloq:$('e10').value},'Salvo')">Salvar</button></div></div>`;$('ov').classList.remove('hide')}
async function del(c){if(confirm('Excluir a placa '+c+'? Ela deixará de funcionar.')){try{await api('del',{codes:[c]});toast('Excluída');cl();await load()}catch(e){toast(e.message)}}}

function lote(){$('ov').innerHTML=`<div class="md"><h3 style="margin:0">Importar lote de placas</h3><span class="m">Envie o arquivo CSV com <b>codigo,modelo</b> (uma placa por linha). Códigos que já existem são ignorados e as placas atuais não mudam.</span><input type="file" id="lf" accept=".csv,.txt" onchange="lread(this.files[0])"><div id="lr" class="m"></div><div class="ac"><button class="btn" onclick="cl()">Cancelar</button><button id="lb" class="btn pr" disabled onclick="lsend()">Importar</button></div></div>`;$('ov').classList.remove('hide')}
let LT=[];
async function lread(f){if(!f)return;const t=await f.text(),ex=new Set(D.map(p=>p.code)),seen=new Set();let mx=Math.max(0,...D.map(p=>p.n)),dup=0,bad=0;LT=[];
 t.replace(/^\ufeff/,'').split(/\r?\n/).forEach((l,i)=>{if(!l.trim())return;const c=l.split(/[,;\t]/).map(s=>s.trim().replace(/^"|"$/g,'')),k=c[0].toLowerCase();if(i==0&&/^c[oó]digo$/.test(k))return;if(!/^[a-z0-9]{4,12}$/.test(k)){bad++;return}if(ex.has(k)||seen.has(k)){dup++;return}seen.add(k);LT.push([k,++mx,c[1]||'Sem modelo'])});
 $('lr').textContent=`${LT.length} novas · ${dup} já existentes (ignoradas) · ${bad} linhas inválidas`;$('lb').disabled=!LT.length}
async function lsend(){try{const j=await api('batch',{items:LT});toast(j.added+' placas adicionadas');cl();await load()}catch(e){toast(e.message)}}
let PD=[];
async function ped(){try{PD=(await api('pedidos')).items;$('mn').innerHTML=`<div class="tb"><button class="btn pr" onclick="npd()">Novo pedido</button><span class="m" style="align-self:center">Cada pedido gera um PIN que deixa o cliente ativar N placas sozinho.</span></div><div class="tw"><table><thead><tr><th>Cliente</th><th>Contato</th><th>Placas</th><th>PIN</th><th>Criado</th><th>Status</th><th></th></tr></thead><tbody>${PD.map((o,i)=>`<tr><td><b>${esc(o.cliente)}</b></td><td>${esc(o.contato)||'—'}</td><td>${o.usadas}/${o.qtd}</td><td><b>${esc(o.pin)}</b></td><td>${ago(o.criado)}</td><td><span class="bd ${o.ativo===false?'livre':'usando'}">${o.ativo===false?'Cancelado':'Ativo'}</span></td><td><button class="btn" onclick="card(${i})">Cartão</button> <button class="btn" onclick="pq(${i})">Qtd</button> <button class="btn" onclick="npin(${i})">Novo PIN</button> <button class="btn dg" onclick="pst(${i})">${o.ativo===false?'Reativar':'Cancelar'}</button></td></tr>`).join('')||'<tr><td colspan=7 class="m">Nenhum pedido ainda</td></tr>'}</tbody></table></div>`}catch(e){if(e)toast(e.message)}}
function npd(){$('ov').innerHTML=`<div class="md"><h3 style="margin:0">Novo pedido</h3><label>Cliente<input id="p1"></label><label>Contato (WhatsApp ou e-mail)<input id="p2"></label><label>Quantidade de placas<input id="p3" type="number" min="1" value="1"></label><div class="ac"><button class="btn" onclick="cl()">Cancelar</button><button class="btn pr" onclick="mkp()">Gerar PIN</button></div></div>`;$('ov').classList.remove('hide')}
async function mkp(){try{const o=(await api('pedido',{cliente:$('p1').value,contato:$('p2').value,qtd:$('p3').value})).pedido;cl();await ped();card(o)}catch(e){toast(e.message)}}
async function pe(i,f,m){try{await api('pedido_edit',{id:PD[i].id,fields:f});toast(m);ped()}catch(e){toast(e.message)}}
function pq(i){const q=prompt('Nova quantidade de placas:',PD[i].qtd);if(q)pe(i,{qtd:q},'Quantidade atualizada')}
function pst(i){pe(i,{ativo:PD[i].ativo===false},'Status atualizado')}
async function npin(i){if(!confirm('Gerar novo PIN? O anterior deixa de funcionar.'))return;try{const o=(await api('pedido_pin',{id:PD[i].id})).pedido;await ped();card({...o,qtd:o.qtd})}catch(e){toast(e.message)}}
function card(o){if(typeof o=='number')o=PD[o];const w=window.open('','_blank');if(!w)return toast('Libere os pop-ups para imprimir');w.document.write(`<title>Cartão de ativação</title><body style="font-family:system-ui,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh"><div style="width:9cm;border:2px solid #2563eb;border-radius:16px;padding:22px;text-align:center"><div style="color:#2563eb;font-weight:800;font-size:24px">VyntraTags</div><p style="margin:14px 0 4px">Seu PIN de ativação</p><div style="font-size:36px;font-weight:800;letter-spacing:5px">${esc(o.pin)}</div><p style="font-size:13px">Aproxime o celular da sua placa e digite o PIN.<br>Placas liberadas: <b>${o.qtd}</b></p><p style="font-size:12px;color:#64748b">${location.origin}/ativar</p></div><script>onload=()=>print()<\/script>`);w.document.close()}
function cl(){$('ov').classList.add('hide')}
function csv(){const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"',r=[['Nº','Código','Modelo','Status','Estabelecimento','Destino','Leituras','Observações'],...view().map(p=>[p.n,p.code,p.modelo,LB[st(p)],p.estab,p.destino,p.scans,p.obs])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.map(x=>x.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='placas.csv';a.click()}
api('list').then(j=>{show(1);load()}).catch(()=>{});
</script></body></html>
